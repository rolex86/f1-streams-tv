name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current channel data
        run: |
          curl -fsSL \
            -A 'Mozilla/5.0' \
            -H 'Origin: https://f1live.dpdns.org' \
            -H 'Referer: https://f1live.dpdns.org/stream' \
            https://cdn.f1live.dpdns.org/channels.json | tee /tmp/channels.json
          echo '--- channels.json ---'
          cat /tmp/channels.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: f1-streams-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
